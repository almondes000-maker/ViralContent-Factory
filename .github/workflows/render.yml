name: Generate Viral Video

on:
  repository_dispatch:
    types: [generate_video]

jobs:
  build-and-render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt update && sudo apt install -y ffmpeg imagemagick fonts-freefont-ttf
          sudo sed -i 's/<policy domain="path" rights="none" pattern="@\*" \/>/<policy domain="path" rights="read | write" pattern="@\*" \/>/' /etc/ImageMagick-6/policy.xml

      - name: Install Python Dependencies
        run: |
          pip install "moviepy<2.0.0" requests edge-tts

      - name: Prepare Audio & Data via Python
        env:
          CAPTION_TEXT: ${{ github.event.client_payload.caption }}
          VOICE_NAME: ${{ github.event.client_payload.voice }}
        run: |
          python -c "
          import os, subprocess

          caption = os.environ.get('CAPTION_TEXT', '')
          voice = os.environ.get('VOICE_NAME', 'en-US-ChristopherNeural')

          # Simpan caption.txt dengan aman tanpa bentrok karakter
          with open('caption.txt', 'w', encoding='utf-8') as f:
              f.write(caption)

          # Buat audio voice.mp3
          cmd = ['edge-tts', '--text', caption, '--write-media', 'voice.mp3', '--voice', voice]
          subprocess.run(cmd, check=True)
          "

      - name: Render Video
        run: python run_factory.py

      - name: Send Video to Telegram
        run: |
          RESPONSE=$(curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendVideo" \
               -F chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
               -F video=@output.mp4 \
               -F caption="$(cat caption.txt)")
          echo "Respon dari Telegram: $RESPONSE"
