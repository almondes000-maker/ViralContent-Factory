name: Generate Viral Video

on:
  repository_dispatch:
    types: [generate_video]

jobs:
  build-and-render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt update && sudo apt install -y ffmpeg imagemagick fonts-freefont-ttf
          sudo sed -i 's/<policy domain="path" rights="none" pattern="@\*" \/>/<policy domain="path" rights="read | write" pattern="@\*" \/>/' /etc/ImageMagick-6/policy.xml

      - name: Install Python Dependencies
        run: |
          pip install "moviepy<2.0.0" requests edge-tts

      - name: Prepare Audio & Data
        run: |
          cat << 'EOF' > b64_audio.txt
          ${{ github.event.client_payload.audio_base64 }}
          EOF
          base64 -d b64_audio.txt > voice.mp3
          
          cat << 'EOF' > caption.txt
          ${{ github.event.client_payload.caption }}
          EOF

      - name: Render Video
        run: python run_factory.py

      - name: Send Video to Telegram
        run: |
          RESPONSE=$(curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendVideo" \
               -F chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
               -F video=@output.mp4 \
               -F caption="$(cat caption.txt)")
          echo "Respon dari Telegram: $RESPONSE"
          ${{ github.event.client_payload.caption }}
          EOF

      - name: Render Video
        run: python run_factory.py

      - name: Send Video to Telegram
        run: |
          curl -F chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
               -F video=@output.mp4 \
               -F caption="$(cat caption.txt)" \
               https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendVideo
          cat << 'EOF' > caption.txt
          ${{ github.event.client_payload.caption }}
          EOF

      - name: Run Video Generator
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          if [ -f main.py ]; then
            python main.py
          elif [ -f render.py ]; then
            python render.py
          fi

            - name: Send Video to Telegram
        run: |
          RESPONSE=$(curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendVideo" \
               -F chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
               -F video=@output.mp4 \
               -F caption="$(cat caption.txt)")
          echo "Respon dari Telegram: $RESPONSE"
